<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriageLab AI - Traductor de Análisis Clínicos</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --gray-100: #f3f4f6;
            --gray-300: #d1d5db;
            --gray-700: #374151;
            --gray-900: #111827;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--gray-100);
            color: var(--gray-900);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .header p {
            color: var(--gray-700);
            font-size: 1.1em;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .upload-area {
            border: 2px dashed var(--gray-300);
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            background-color: #fafafa;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background-color: var(--primary-light);
        }

        .upload-area button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }

        .loader-container {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            border: 4px solid var(--gray-100);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #results-section {
            display: none;
        }

        .disclaimer {
            background-color: var(--danger-light);
            border-left: 4px solid var(--danger);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
        }

        .disclaimer h4 {
            color: var(--danger);
            margin: 0 0 5px 0;
        }

        .disclaimer p {
            margin: 0;
            font-size: 0.9em;
            color: var(--gray-700);
        }

        .result-item {
            border: 1px solid var(--gray-300);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .result-item.normal { border-left: 4px solid var(--success); }
        .result-item.warning { border-left: 4px solid var(--warning); }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .status-normal { background: #d1fae5; color: #065f46; }
        .status-warning { background: #fef3c7; color: #92400e; }

        .ai-explanation {
            background: var(--primary-light);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95em;
            color: var(--gray-700);
        }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <h1>Guardian AI 🔬</h1>
        <p>Tus análisis clínicos, explicados de forma simple y humana.</p>
    </header>

    <!-- Sección 1: Carga de Archivo -->
    <div class="card" id="upload-section">
        <h3>1. Sube tus resultados</h3>
        <p>Sube el archivo PDF que te entregó el laboratorio.</p>
        <div class="upload-area">
            <p>📄 Arrastra tu PDF aquí o haz clic para buscar</p>
            <button>Seleccionar Archivo</button>
        </div>
    </div>

    <!-- Sección 2: Procesamiento -->
    <div class="card loader-container" id="loader-section">
        <div class="spinner"></div>
        <h3>Analizando documento...</h3>
        <p>Extrayendo datos y traduciendo términos médicos (esto toma unos segundos).</p>
    </div>

    <!-- Sección 3: Resultados -->
    <div id="results-section"></div>
</div>

<script>
    const uploadArea = document.querySelector('.upload-area');
    
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'application/pdf';
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);

    uploadArea.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        document.getElementById('upload-section').style.display = 'none';
        document.getElementById('loader-section').style.display = 'block';
        
        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch('http://127.0.0.1:8000/api/analizar-resultados', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.detail || "Error al analizar el PDF");
            }

            const data = await response.json();
            renderizarResultados(data.resultados);

        } catch (error) {
            alert("Hubo un error comunicándose con el servidor: " + error.message);
            resetApp();
        }
    });

    function renderizarResultados(resultados) {
        document.getElementById('loader-section').style.display = 'none';
        const resultsSection = document.getElementById('results-section');
        resultsSection.style.display = 'block';

        let htmlContenido = `
            <div class="disclaimer">
                <h4>⚠️ Aviso Importante (Guardrail de Seguridad)</h4>
                <p><strong>Guardian AI NO es un médico ni emite diagnósticos.</strong> Esta es una traducción orientativa. Si detectas valores críticos, <strong>por favor, adelanta el turno con tu médico</strong>.</p>
            </div>
            <div class="card">
                <h3>Tus Resultados Explicados</h3>
        `;

        resultados.forEach(item => {
            let cssClass = 'normal';
            let badgeClass = 'status-normal';
            
            if (item.status === 'Ligeramente Elevado' || item.status === 'Ligeramente Bajo' || item.status === 'Crítico') {
                cssClass = 'warning';
                badgeClass = 'status-warning';
            }

            htmlContenido += `
                <div class="result-item ${cssClass}">
                    <div class="result-header">
                        <span>${item.test_name}</span>
                        <span class="status-badge ${badgeClass}">${item.status}</span>
                    </div>
                    <div class="ai-explanation">
                        <strong>Traducción AI:</strong> ${item.explanation}
                    </div>
                </div>
            `;
        });

        htmlContenido += `<button style="width: 100%; padding: 12px; background: var(--gray-700); color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px;" onclick="resetApp()">Subir otro análisis</button></div>`;
        
        resultsSection.innerHTML = htmlContenido;
    }

    function resetApp() {
        document.getElementById('results-section').style.display = 'none';
        document.getElementById('upload-section').style.display = 'block';
        document.getElementById('loader-section').style.display = 'none';
        fileInput.value = "";
    }
</script>
</body>
</html>
